/* ==========================================================================
   16.  UI MANAGER  —  HUD, god-power panel, chronicle, and all input
   ========================================================================== */
class UIManager{
  constructor(game){
    this.game=game;
    this.tool="human";
    this.brush=1;              // radius 0..4
    this.hoverTile=null;
    this.selectedSettlement=null;
    this._toastTimer=null;
    this._buildPanel();
    this._bind();
    this.syncControls();
    this.selectTool("human");
  }

  /* --- build the god-power buttons from the TOOLS table ------------------ */
  _buildPanel(){
    const host=document.getElementById("godpowers");
    host.innerHTML="";
    for(const group of TOOLS){
      const c=document.createElement("div");
      c.className="category "+group.cls;
      c.innerHTML=`<h2>${group.cat}</h2>`;
      const grid=document.createElement("div");
      grid.className="tool-grid";
      for(const it of group.items){
        const b=document.createElement("div");
        b.className="tool"; b.dataset.tool=it.id;
        b.innerHTML=`<span class="ti">${it.icon}</span><span class="tn">${it.name}</span>`;
        b.addEventListener("click",()=>this.selectTool(it.id));
        b.addEventListener("mouseenter",()=>{document.getElementById("tooldesc").innerHTML=it.desc;});
        grid.appendChild(b);
      }
      c.appendChild(grid);
      host.appendChild(c);
    }
  }

  selectTool(id){
    this.tool=id;
    document.querySelectorAll(".tool").forEach(t=>t.classList.toggle("active",t.dataset.tool===id));
    const def=TOOLS.flatMap(g=>g.items).find(i=>i.id===id);
    if(def) document.getElementById("tooldesc").innerHTML=def.desc;
  }

  /* --- wire up all DOM & canvas events ----------------------------------- */
  _bind(){
    const g=this.game, cv=g.renderer.canvas;

    // top-bar controls
    document.getElementById("btn-play").addEventListener("click",()=>g.sim.togglePause());
    [["btn-s1",1],["btn-s2",2],["btn-s5",5]].forEach(([id,sp])=>{
      document.getElementById(id).addEventListener("click",()=>g.sim.setSpeed(sp));
    });
    document.getElementById("btn-reset").addEventListener("click",()=>g.reset());

    // zoom controls
    document.getElementById("zoom-in").addEventListener("click",()=>this._zoomBy(1.25));
    document.getElementById("zoom-out").addEventListener("click",()=>this._zoomBy(0.8));
    document.getElementById("zoom-home").addEventListener("click",()=>{g.camera.fit(cv.width,cv.height);});

    // brush slider
    const bs=document.getElementById("brushSize");
    bs.addEventListener("input",()=>{this.brush=+bs.value;document.getElementById("brushVal").textContent=this.brush;});

    // right-panel tabs
    document.querySelectorAll(".tab").forEach(tab=>{
      tab.addEventListener("click",()=>{
        document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
        document.querySelectorAll(".tabpage").forEach(p=>p.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById("page-"+tab.dataset.tab).classList.add("active");
      });
    });

    // ---- canvas input: paint / pan / zoom ----
    let painting=false, panning=false, lastX=0,lastY=0;

    const applyAt=(sx,sy)=>{
      const {x,y}=g.camera.screenToTile(sx,sy);
      this.applyTool(x,y);
    };

    cv.addEventListener("mousedown",(ev)=>{
      const r=cv.getBoundingClientRect(); const sx=ev.clientX-r.left, sy=ev.clientY-r.top;
      if(ev.button===1 || ev.button===2){ panning=true; lastX=ev.clientX; lastY=ev.clientY; ev.preventDefault(); }
      else if(ev.button===0){
        // select settlement if clicking near a town hall & using a non-painting inspect? -> left always paints
        painting=true; applyAt(sx,sy);
      }
    });
    window.addEventListener("mousemove",(ev)=>{
      const r=cv.getBoundingClientRect(); const sx=ev.clientX-r.left, sy=ev.clientY-r.top;
      if(sx>=0&&sy>=0&&sx<=r.width&&sy<=r.height){
        this.hoverTile=g.camera.screenToTile(sx,sy);
      } else this.hoverTile=null;
      if(panning){
        g.camera.x-=(ev.clientX-lastX)/g.camera.zoom;
        g.camera.y-=(ev.clientY-lastY)/g.camera.zoom;
        lastX=ev.clientX; lastY=ev.clientY;
        g.camera.clampCam(cv.width,cv.height);
      } else if(painting && sx>=0&&sy>=0&&sx<=r.width&&sy<=r.height){
        applyAt(sx,sy);
      }
    });
    window.addEventListener("mouseup",()=>{painting=false;panning=false;});
    cv.addEventListener("contextmenu",e=>e.preventDefault());
    cv.addEventListener("mouseleave",()=>{this.hoverTile=null;});

    // wheel zoom toward cursor
    cv.addEventListener("wheel",(ev)=>{
      ev.preventDefault();
      const r=cv.getBoundingClientRect(); const sx=ev.clientX-r.left, sy=ev.clientY-r.top;
      const before=g.camera.screenToTile(sx,sy);
      this._zoomBy(ev.deltaY<0?1.15:0.87, false);
      const after=g.camera.screenToTile(sx,sy);
      g.camera.x += (before.x-after.x)*CONFIG.TILE;
      g.camera.y += (before.y-after.y)*CONFIG.TILE;
      g.camera.clampCam(cv.width,cv.height);
    },{passive:false});

    // keyboard shortcuts
    window.addEventListener("keydown",(ev)=>{
      if(ev.code==="Space"){ ev.preventDefault(); g.sim.togglePause(); }
      else if(ev.key==="1")g.sim.setSpeed(1);
      else if(ev.key==="2")g.sim.setSpeed(2);
      else if(ev.key==="5")g.sim.setSpeed(5);
      else if(ev.key==="+"||ev.key==="=")this._zoomBy(1.2);
      else if(ev.key==="-")this._zoomBy(0.83);
      const map={g:"grass",t:"tree",f:"flower",w:"water",h:"human",o:"orc",e:"elf",m:"monster"};
      if(map[ev.key]) this.selectTool(map[ev.key]);
    });

    window.addEventListener("resize",()=>{
      g.renderer.resize();
      g.camera.clampCam(cv.width,cv.height);
    });
  }

  _zoomBy(f,recentre=true){
    const g=this.game, cv=g.renderer.canvas;
    const cx=cv.width/2, cy=cv.height/2;
    const before=recentre? g.camera.screenToTile(cx,cy):null;
    g.camera.zoom=clamp(g.camera.zoom*f,g.camera.minZoom,g.camera.maxZoom);
    if(recentre){
      const after=g.camera.screenToTile(cx,cy);
      g.camera.x+=(before.x-after.x)*CONFIG.TILE;
      g.camera.y+=(before.y-after.y)*CONFIG.TILE;
    }
    g.camera.clampCam(cv.width,cv.height);
  }

  /* --- apply the current god power at a tile (respecting brush size) ----- */
  applyTool(cx,cy){
    const g=this.game, w=g.world;
    if(!w.inBounds(cx,cy)) return;
    const r=this.brush;
    const single = ["volcano","meteor","quake","lightning","human","orc","elf","monster"].includes(this.tool);

    if(single){
      this._applySingle(cx,cy); return;
    }
    // painting tools affect a brush area
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      if(dx*dx+dy*dy>r*r+ (r>0?0.5:0)) continue;
      this._applyBrush(cx+dx,cy+dy);
    }
    w.dirty=true;
  }

  _applyBrush(x,y){
    const w=this.game.world, t=w.get(x,y); if(!t)return;
    switch(this.tool){
      case "grass": if(t.biome!==BIOME.DEEP_WATER){ t.biome=BIOME.GRASS; t.fertility=Math.max(t.fertility,0.6); t.resource=t.resource===RES.STONE?RES.NONE:t.resource; } break;
      case "tree":  if(t.walkable && t.structure===STRUCT.NONE){ t.resource=RES.TREE; t.health=100; if(t.biome===BIOME.ROCK||t.biome===BIOME.ASH)t.biome=BIOME.FOREST_FLOOR; } break;
      case "flower":if(t.walkable && t.resource===RES.NONE){ t.resource=RES.FLOWER; t.health=100; } break;
      case "water": t.biome= (Math.random()<0.6)?BIOME.WATER:BIOME.DEEP_WATER; t.resource=RES.NONE; t.structure=STRUCT.NONE; t.fertility=0.9; break;
      case "fire":  this.game.disasters.startFire(x,y); break;
      case "acid":  t.acid=6; this.game.disasters.acid.push({x,y}); break;
      case "house": case "farm": case "mine": case "road": this._placeStructure(x,y); break;
    }
  }

  _applySingle(x,y){
    const g=this.game;
    switch(this.tool){
      case "human":   for(let i=0;i<1+this.brush;i++)g.entities.spawn(RACE.HUMAN,x+ (Math.random()-.5), y+(Math.random()-.5)); this.toast("Humans placed"); break;
      case "orc":     for(let i=0;i<1+this.brush;i++)g.entities.spawn(RACE.ORC,x+ (Math.random()-.5), y+(Math.random()-.5)); this.toast("Orcs unleashed"); break;
      case "elf":     for(let i=0;i<1+this.brush;i++)g.entities.spawn(RACE.ELF,x+ (Math.random()-.5), y+(Math.random()-.5)); this.toast("Elves placed"); break;
      case "monster": g.entities.spawn(RACE.MONSTER,x,y); this.toast("A monster prowls"); break;
      case "lightning": g.disasters.lightning(x,y); break;
      case "meteor":  g.disasters.meteor(x,y); break;
      case "quake":   g.disasters.earthquake(x,y); break;
      case "volcano": g.disasters.volcano(x,y); break;
    }
  }

  _placeStructure(x,y){
    const w=this.game.world, t=w.get(x,y); if(!t||!t.walkable)return;
    const map={house:STRUCT.HOUSE,farm:STRUCT.FARM,mine:STRUCT.MINE,road:STRUCT.ROAD};
    if(t.structure!==STRUCT.NONE && this.tool!=="road") return;
    t.structure=map[this.tool]; t.health=120; t.resource=RES.NONE;
    // attach to nearest settlement (so it counts economically)
    let best=null,bd=1e9;
    for(const s of this.game.settlements.list){ if(s.destroyed)continue; const d=dist2(x,y,s.cx,s.cy); if(d<bd){bd=d;best=s;} }
    if(best && bd<24*24){ t.owner=best.id; best.territory.add(y*w.w+x); this.game.settlements._recount(best); }
    w.dirty=true;
  }

  /* --- HUD refresh (called each frame, cheap) ---------------------------- */
  updateHUD(){
    const g=this.game;
    let pop=g.entities.list.length;
    let food=0,wood=0,stone=0;
    for(const s of g.settlements.list){ if(s.destroyed)continue; food+=s.res.food; wood+=s.res.wood; stone+=s.res.stone; }
    document.getElementById("s-year").textContent=g.sim.year;
    document.getElementById("s-pop").textContent=pop;
    document.getElementById("s-food").textContent=Math.floor(food);
    document.getElementById("s-wood").textContent=Math.floor(wood);
    document.getElementById("s-stone").textContent=Math.floor(stone);
    document.getElementById("s-settle").textContent=g.settlements.activeCount();
    const pill=document.getElementById("seasonPill");
    pill.textContent=`${g.sim.seasonIcon} ${g.sim.seasonName}`;
    pill.style.background={Spring:"#2c4a2c",Summer:"#4a4322",Autumn:"#4a3322",Winter:"#233a4a"}[g.sim.seasonName];
  }

  syncControls(){
    const g=this.game;
    const play=document.getElementById("btn-play");
    play.textContent=g.sim.paused?"▶ Play":"⏸ Pause";
    play.classList.toggle("active",!g.sim.paused);
    [["btn-s1",1],["btn-s2",2],["btn-s5",5]].forEach(([id,sp])=>{
      document.getElementById(id).classList.toggle("active",g.sim.speed===sp && !g.sim.paused);
    });
  }

  toast(msg){
    const el=document.getElementById("toast");
    el.textContent=msg; el.classList.add("show");
    clearTimeout(this._toastTimer);
    this._toastTimer=setTimeout(()=>el.classList.remove("show"),1600);
  }

  /* --- right-panel renderers --------------------------------------------- */
  renderChronicle(){
    const host=document.getElementById("page-chronicle");
    if(!this.game.chronicle.entries.length){ host.innerHTML='<div class="empty">The world is young.<br>Place life and shape the land to begin its story.</div>'; return; }
    const items=this.game.chronicle.entries.slice(-80).reverse();
    host.innerHTML=items.map(e=>`<div class="logentry ${e.type}"><span class="yr">Y${e.year}</span>${e.text}</div>`).join("");
    host.scrollTop=0;
  }
  renderKingdoms(){
    const host=document.getElementById("page-kingdoms");
    const list=this.game.settlements.list.filter(s=>!s.destroyed).sort((a,b)=>b.pop-a.pop);
    if(!list.length){ host.innerHTML='<div class="empty">No settlements yet.<br>Place humans or elves and watch them build.</div>'; return; }
    host.innerHTML=list.map(s=>{
      const h=Math.floor(s.happiness);
      const hcol=h>60?"var(--success)":h>35?"var(--gold)":"var(--danger)";
      return `<div class="kcard" style="border-left-color:${s.color}">
        <h3>${s.name} <span class="race">· ${s.title}</span></h3>
        <div class="race">${s.kingdom} — ${s.race}</div>
        <div class="row"><span>👑 ${s.leader?s.leader.name:'—'}</span></div>
        <div class="row"><span>Pop</span><b>${s.pop}/${s.capacity}</b></div>
        <div class="row"><span>🍖 ${Math.floor(s.res.food)}</span><span>🪵 ${Math.floor(s.res.wood)}</span><span>⛏️ ${Math.floor(s.res.stone)}</span></div>
        <div class="row"><span>🏠 ${s.houses}</span><span>🌾 ${s.farms}</span><span>⛏️ ${s.mines}</span></div>
        <div class="row"><span>Happiness</span><b style="color:${hcol}">${h}%</b></div>
        <div class="kbar"><i style="width:${h}%;background:${hcol}"></i></div>
      </div>`;
    }).join("");
  }
  renderAchievements(){
    const host=document.getElementById("page-achieve");
    const a=this.game.chronicle.achievements;
    if(!a.length){ host.innerHTML='<div class="empty">No legends yet.<br>Great deeds and disasters will be remembered here.</div>'; return; }
    host.innerHTML=a.slice().reverse().map(x=>`<div class="ach"><span class="ai">${x.icon}</span><div><div class="at">${x.title}</div><div class="ad">${x.desc} · Year ${x.year}</div></div></div>`).join("");
  }
}

/* ==========================================================================
   17.  GAME  —  top-level orchestrator & main loop
   ========================================================================== */
class Game{
  constructor(){
    this.seed=(Math.random()*1e9)|0;
    this.world=new World(CONFIG.W,CONFIG.H);
    this.world.generate(this.seed);

    // managers
    this.sim=new SimulationManager(this);
    this.entities=new EntityManager(this);
    this.settlements=new SettlementManager(this);
    this.disasters=new DisasterManager(this);
    this.effects=new EffectManager(this);
    this.chronicle=new Chronicle(this);
    this.camera=new Camera(this);

    // view
    this.renderer=new Renderer(this,document.getElementById("world"));
    this.renderer.resize();
    this.camera.fit(this.renderer.canvas.width,this.renderer.canvas.height);

    // UI last (needs renderer + managers)
    this.ui=new UIManager(this);

    this._seedWorld();
    this.ui.renderChronicle();
    this.ui.renderKingdoms();
    this.ui.renderAchievements();

    this.last=performance.now();
    this._kingdomsCd=0;
    this.chronicle.log("🌍 A new world is born, split between fire and life.","found");
    requestAnimationFrame(this.loop.bind(this));
  }

  /* place a small starting population so there is something to watch */
  _seedWorld(){
    const w=this.world;
    // a cluster of humans on the fertile right bank
    const hx=Math.floor(w.w*0.72), hy=Math.floor(w.h*0.5);
    for(let i=0;i<8;i++) this.entities.spawn(RACE.HUMAN, hx+rint(Math.random,-3,3), hy+rint(Math.random,-3,3));
    // a grove of elves further into the forest
    const ex=Math.floor(w.w*0.85), ey=Math.floor(w.h*0.7);
    for(let i=0;i<5;i++) this.entities.spawn(RACE.ELF, ex+rint(Math.random,-3,3), ey+rint(Math.random,-3,3));
    // a lurking orc warband on the wasteland border
    const ox=Math.floor(w.w*0.4), oy=Math.floor(w.h*0.35);
    for(let i=0;i<3;i++) this.entities.spawn(RACE.ORC, ox+rint(Math.random,-2,2), oy+rint(Math.random,-2,2));
  }

  reset(){
    this.seed=(Math.random()*1e9)|0;
    SETTLE_ID=1; ENTITY_ID=1;
    this.world=new World(CONFIG.W,CONFIG.H);
    this.world.generate(this.seed);
    this.entities=new EntityManager(this);
    this.settlements=new SettlementManager(this);
    this.disasters=new DisasterManager(this);
    this.effects.clear();
    this.chronicle=new Chronicle(this);
    this.sim.ticks=0; this.sim.acc=0; this.sim.queue.length=0; this.sim.season=0; this.sim.paused=false;
    this.renderer=new Renderer(this,document.getElementById("world"));
    this.renderer.resize();
    this.camera.fit(this.renderer.canvas.width,this.renderer.canvas.height);
    this._seedWorld();
    this.chronicle.log("🌍 The god remakes the world anew.","found");
    this.ui.renderChronicle(); this.ui.renderKingdoms(); this.ui.renderAchievements();
    this.ui.syncControls();
    this.ui.toast("World regenerated");
  }

  /* --- world-level per-tick upkeep (regrowth, cooling, seasons) ---------- */
  world_tick(){
    const w=this.world, sim=this.sim;
    // regrow a handful of random tiles each tick to keep forests alive
    for(let i=0;i<30;i++){
      const x=rint(Math.random,0,w.w-1), y=rint(Math.random,0,w.h-1);
      const t=w.get(x,y);
      if(!t)continue;
      // trees slowly reclaim fertile empty ground (elf territory faster)
      if(t.resource===RES.NONE && t.structure===STRUCT.NONE && t.walkable && t.fertility>0.55 &&
         (t.biome===BIOME.FOREST_FLOOR||t.biome===BIOME.GRASS||t.biome===BIOME.FERTILE)){
        if(Math.random()<0.02*sim.seasonFactor){ t.resource=Math.random()<0.7?RES.TREE:RES.FLOWER; t.health=30; w.dirty=true; }
      }
      // grown trees heal back to full
      if((t.resource===RES.TREE||t.resource===RES.PINE)&&t.health<100){ t.health=Math.min(100,t.health+4); }
      // dirt slowly returns to grass in fertile zones
      if(t.biome===BIOME.DIRT && t.fertility>0.4 && Math.random()<0.01){ t.biome=BIOME.GRASS; w.dirty=true; }
    }
  }

  onSeasonChange(){
    this.ui.updateHUD();
    if(this.sim.season===3) this.chronicle.log("❄️ Winter descends. Food grows scarce across the world.","info");
    else if(this.sim.season===0 && this.sim.year>0) this.chronicle.log("🌱 Spring returns; the land renews itself.","info");
  }

  onNewYear(){
    const y=this.sim.year;
    // survival & scale achievements
    if(this.entities.list.length>=50) this.chronicle.achieve("pop50","👥","A Thriving World","The world's population surpasses 50 souls.");
    if(y>=100) this.chronicle.achieve("year100","📜","A Century of History","The world endures for 100 years.");
    // legendary heroes: long-lived nomads
    for(const e of this.entities.list){
      if(!e.settlement && e.legendYears>50 && (e.race===RACE.HUMAN||e.race===RACE.ELF)){
        this.chronicle.achieve("hero_"+e.id,"⭐",`${e.name} the Legend`,`A lone survivor endures ${Math.floor(e.legendYears)} years in the wild.`);
      }
    }
    this.ui.renderKingdoms();
  }

  /* --- random world events fired periodically by the simulation ---------- */
  fireRandomEvent(){
    const w=this.world, roll=Math.random();
    const rx=rint(Math.random,0,w.w-1), ry=rint(Math.random,0,w.h-1);
    if(roll<0.14){
      // wandering monster appears in the wilds
      const x=rint(Math.random,0,Math.floor(w.w*0.5)), y=rint(Math.random,0,w.h-1);
      if(this.world.get(x,y)?.walkable){ this.entities.spawn(RACE.MONSTER,x,y); this.chronicle.log("🐉 A monster emerges from the wasteland.","war"); }
    } else if(roll<0.26){
      this.disasters.startFire(rx,ry);
    } else if(roll<0.36){
      // bountiful harvest
      for(const s of this.settlements.list){ if(!s.destroyed) s.res.food+=25; }
      if(this.settlements.activeCount()) this.chronicle.log("🌾 A bountiful harvest blesses the realms! Granaries overflow.","trade");
    } else if(roll<0.46){
      // orc warband migration onto the map edge
      const y=rint(Math.random,0,w.h-1);
      for(let i=0;i<3;i++) this.entities.spawn(RACE.ORC, rint(Math.random,0,3), y+rint(Math.random,-2,2));
      this.chronicle.log("👹 An orc warband marches from beyond the western ash.","war");
    } else if(roll<0.55){
      this.disasters.lightning(rx,ry);
    } else if(roll<0.63){
      // plague strikes a settlement
      const alive=this.settlements.list.filter(s=>!s.destroyed && s.pop>3);
      if(alive.length){ const s=choice(Math.random,alive); for(const m of s.members) if(Math.random()<0.3)m.hp-=40;
        this.chronicle.log(`🤢 A plague sweeps through ${s.name}.`,"death"); }
    } else if(roll<0.70){
      // migration: nomads drawn to the largest realm
      this.chronicle.log("🧭 Restless folk wander the roads seeking a new home.","info");
      for(let i=0;i<3;i++){ const e=this.entities.spawn(RACE.HUMAN, rint(Math.random,Math.floor(w.w*0.55),w.w-1), rint(Math.random,0,w.h-1)); }
    } else if(roll<0.76){
      this.disasters.meteor(rx,ry);
    } else {
      // quiet year — nothing dramatic
    }
    this.ui.updateHUD();
  }

  /* --- the main animation loop ------------------------------------------ */
  loop(now){
    const dt=Math.min(0.05,(now-this.last)/1000);
    this.last=now;

    // advance simulation (fixed timestep inside)
    this.sim.advance(dt);

    // continuous / cosmetic updates
    this.camera.update(dt);
    this.effects.update(dt);

    // render
    this.renderer.render();

    // HUD every frame (cheap); heavier panels throttled
    this.ui.updateHUD();
    this._kingdomsCd-=dt;
    if(this._kingdomsCd<=0){ this.ui.renderKingdoms(); this._kingdomsCd=1.0; }

    requestAnimationFrame(this.loop.bind(this));
  }
}

/* --------------------------------------------------------------------------
   18.  BOOT
   -------------------------------------------------------------------------- */
window.addEventListener("load",()=>{ window.GAME=new Game(); });
</script>
